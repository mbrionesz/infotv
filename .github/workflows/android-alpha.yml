name: XuperAndroid beta
on:
  workflow_dispatch:
    inputs:
      portal_probe:
        description: Record a redacted real-portal metadata diagnostic with an own installation session
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        suite: [pip, functional]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the compile SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Compile APK, unit tests and lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :core:model:test :core:data:testDebugUnitTest :app:lintDebug
      - name: Enable hardware acceleration for the runner user
        run: |
          if [ -e /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Real Android UI and native playback test
        env:
          XUPER_QA_SUITE: ${{ matrix.suite }}
          XUPER_PORTAL_PROBE: ${{ inputs.portal_probe && '1' || '0' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: bash ../.github/scripts/verify-android-ui.sh
      - name: Pull Android screenshots
        if: always()
        run: adb pull /data/local/tmp/xuperandroid-qa android/qa-screenshots || true
      - name: Preserve APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XuperAndroid-0.1.1-beta9-${{ matrix.suite }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/lint-results-debug.html
            android/qa-screenshots/
            android/qa-evidence/
            android/core/model/build/test-results/
            android/core/data/build/test-results/
