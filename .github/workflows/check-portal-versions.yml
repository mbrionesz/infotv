name: Check public portal client versions
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-portal-client-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public client sources without executing them
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check-portal-versions.py
      - name: Save informational report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/portal-client-watch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public portal client version report'
          git pull --rebase origin main
          git push origin HEAD:main
