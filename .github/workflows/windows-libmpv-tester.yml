name: XuperWindows isolated libmpv tester
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable tester source tag
        required: true
        default: v0.1.14-test-libmpv.131
      tag:
        description: Existing release receiving additional tester installers
        required: true
        default: v0.10.21-beta.6
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@v4
        id: dependencies
        with:
          path: |
            node_modules
            desktop/node_modules
          key: libmpv-windows-node22-${{ hashFiles('package-lock.json', 'desktop/package-lock.json') }}
      - run: npm ci
        if: steps.dependencies.outputs.cache-hit != 'true'
      - run: npm ci --prefix desktop
        if: steps.dependencies.outputs.cache-hit != 'true'
      - name: Verify libmpv DLLs and compile private C API hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/prepare-libmpv-tester.mjs
      - run: node --test tests/desktop/*.test.mjs
      - run: npm run build
        env:
          XUPER_BUILD_TARGET: windows
      - run: node tools/build-desktop.mjs
      - run: node tools/build-libmpv-tester.mjs
      - name: Reject missing local DLLs even when the runner has system Vulkan
        run: node tools/libmpv-loader-smoke.mjs
      - name: Actual x64 libmpv decode, tracks, styles, cache and long seeks
        run: node tools/libmpv-codec-smoke.mjs
      - name: Actual embedded Electron GUI and visible x64 frames
        run: desktop/node_modules/.bin/electron tools/libmpv-desktop-smoke.cjs
      - name: Preserve visual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XuperWindows-libmpv-visual
          path: dist/xuperwindows-libmpv-*.png
          if-no-files-found: ignore
      - name: Build isolated tester installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: desktop/node_modules/.bin/electron-builder --projectDir desktop-tester --win nsis --x64
      - name: Verify packaged native resources
        env:
          XUPER_PACKAGED_DECODERS: '1'
        run: node tools/libmpv-codec-smoke.mjs
      - name: Hash installers and archive source
        shell: pwsh
        run: |
          $files=Get-ChildItem dist/windows-tester/*-Setup.exe
          if ($files.Count -ne 1) { throw 'Expected the x64 tester installer' }
          $sums=@{}
          foreach ($file in $files) { $sums[$file.Name]=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower() }
          $sums | ConvertTo-Json | Set-Content dist/windows-tester/SHA256SUMS-XuperWindows-Tester-libmpv-r3.json
          git archive --format=zip --prefix=XuperWindows-Tester-source/ -o dist/windows-tester/XuperWindows-Tester-libmpv-r3-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: XuperWindows-Tester-0.1.14-libmpv
          path: |
            dist/windows-tester/*-Setup.exe
            dist/windows-tester/SHA256SUMS-XuperWindows-Tester-libmpv-r3.json
            dist/windows-tester/XuperWindows-Tester-libmpv-r3-source.zip
      - name: Attach tester alternatives without replacing production
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets=@((Get-ChildItem dist/windows-tester/*-Setup.exe).FullName)+@('dist/windows-tester/SHA256SUMS-XuperWindows-Tester-libmpv-r3.json','dist/windows-tester/XuperWindows-Tester-libmpv-r3-source.zip')
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY @assets
          if ($LASTEXITCODE -ne 0) { throw 'Tester upload failed' }
