name: Build unsigned XuperTizen WGT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libcurl4-openssl-dev openssl
      - run: npm test
      - run: npm run test:native-wasm
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: XuperTizen-unsigned-WGT
          path: |
            dist/*.wgt
            dist/SHA256SUMS.json
            dist/release-info.json
