name: XuperWindows 0.1.3 beta
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Shared Tizen release receiving the Windows installers
        required: true
        default: v0.10.21-beta.1
      source_ref:
        description: Windows source tag (independent version)
        required: true
        default: v0.1.3-beta.6

permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Download and verify native decoders
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/prepare-desktop-native.mjs
      - run: node --test tests/desktop/*.test.mjs
      - name: Real HEVC decoding and authorized proxy test
        run: node tools/native-codec-smoke.mjs
      - run: npm run build
        env:
          XUPER_BUILD_TARGET: windows
      - run: node tools/build-desktop.mjs
      - name: Actual Electron desktop smoke test
        run: desktop/node_modules/.bin/electron tools/desktop-smoke.cjs
      - name: Build separate x64 and x86 installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist --prefix desktop
      - name: Verify executables and checksums
        shell: pwsh
        run: |
          $files=Get-ChildItem dist/windows/*-Setup.exe
          if ($files.Count -ne 2) { throw 'Expected two Windows installers' }
          $sums=@{}
          foreach ($file in $files) { $sums[$file.Name]=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower() }
          $sums | ConvertTo-Json | Set-Content dist/windows/SHA256SUMS-XuperWindows-0.1.3.json
      - uses: actions/upload-artifact@v4
        with:
          name: XuperWindows-0.1.3-beta
          path: |
            dist/windows/*-Setup.exe
            dist/windows/SHA256SUMS-XuperWindows-0.1.3.json
            dist/xuperwindows-0.1.3-smoke.png
      - name: Attach Windows installers to the shared beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Publish the Tizen release first' }
          git archive --format=zip --prefix=XuperWindows-source/ -o dist/windows/XuperWindows-0.1.3-source.zip HEAD
          $assets=@('dist/windows/XuperWindows-0.1.3-source.zip')+@((Get-ChildItem dist/windows/*-Setup.exe).FullName)+@('dist/windows/SHA256SUMS-XuperWindows-0.1.3.json')
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
