name: Publish XuperTizen prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared release tag
        required: true
        default: v0.10.5-beta.1
        type: choice
        options:
          - v0.2.0-alpha.1
          - v0.3.0-alpha.1
          - v0.3.1-alpha.1
          - v0.4.0-alpha.1
          - v0.4.1-alpha.1
          - v0.4.2-alpha.1
          - v0.4.3-alpha.1
          - v0.4.4-alpha.1
          - v0.5.0-alpha.1
          - v0.5.1-alpha.1
          - v0.5.2-alpha.1
          - v0.5.3-alpha.1
          - v0.5.4-alpha.1
          - v0.5.5-alpha.1
          - v0.5.6-alpha.1
          - v0.5.7-alpha.1
          - v0.5.8-alpha.1
          - v0.5.9-alpha.1
          - v0.6.0-alpha.1
          - v0.6.1-alpha.1
          - v0.6.2-alpha.1
          - v0.6.3-alpha.1
          - v0.6.4-alpha.1
          - v0.6.5-alpha.1
          - v0.6.6-alpha.1
          - v0.7.0-beta.1
          - v0.8.0-beta.1
          - v0.8.1-beta.1
          - v0.8.2-beta.1
          - v0.8.3-beta.1
          - v0.8.4-beta.1
          - v0.8.5-beta.1
          - v0.8.6-beta.1
          - v0.8.7-beta.1
          - v0.8.8-beta.1
          - v0.8.9-beta.1
          - v0.8.10-beta.1
          - v0.8.11-beta.1
          - v0.8.12-beta.1
          - v0.8.13-beta.1
          - v0.9.0-beta.1
          - v0.9.1-beta.1
          - v0.9.2-beta.1
          - v0.9.3-beta.1
          - v0.9.4-beta.1
          - v0.9.5-beta.1
          - v0.9.6-beta.1
          - v0.9.7-beta.1
          - v0.9.8-beta.1
          - v0.9.9-beta.1
          - v0.9.10-beta.1
          - v0.10.0-beta.1
          - v0.10.1-beta.1
          - v0.10.2-beta.1
          - v0.10.3-beta.1
          - v0.10.3-beta.2
          - v0.10.4-beta.1
          - v0.10.5-beta.1
      publish_artifacts:
        description: Publish built artifacts (false runs verification only)
        required: true
        default: true
        type: boolean
      tmdb_public_config_b64:
        description: Owner-authorized public TMDB configuration (base64; not a secret store)
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libcurl4-openssl-dev openssl
      - run: npm test
      - run: npm run test:native-wasm
      - name: Package public widget with owner-authorized TMDB configuration
        env:
          XUPER_TMDB_PUBLIC_KEY: ${{ secrets.XUPER_TMDB_PUBLIC_KEY }}
          TMDB_PUBLIC_CONFIG_B64: ${{ inputs.tmdb_public_config_b64 }}
        run: |
          if [ -n "$TMDB_PUBLIC_CONFIG_B64" ]; then
            XUPER_TMDB_PUBLIC_KEY="$(printf '%s' "$TMDB_PUBLIC_CONFIG_B64" | base64 --decode)"
            echo "::add-mask::$XUPER_TMDB_PUBLIC_KEY"
            export XUPER_TMDB_PUBLIC_KEY
          fi
          if [ "${{ inputs.publish_artifacts }}" = "true" ] && [ -f tools/tmdb_provision.py ]; then test -n "$XUPER_TMDB_PUBLIC_KEY"; fi
          npm run package
      - name: Upload verified build and publish the prepared prerelease
        if: ${{ inputs.publish_artifacts }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          assets=(
            dist/XuperTizen-*-Tizen4plus-UNSIGNED.wgt
            dist/XuperTizen-*-source.zip
            dist/SHA256SUMS.json
            dist/release-info.json
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --title "XuperTizen ${RELEASE_TAG#v} — Tizen 4.0+" \
              --notes-file "docs/RELEASE-${RELEASE_TAG#v}.md" "${assets[@]}"
          fi
